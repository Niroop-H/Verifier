name: EDA Session 1 CI

on:
  push:
    branches: [main, "session1/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: eda-session1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-validation:
    name: Python tests and source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Validate isolated worker runner syntax
        run: bash -n scripts/run_isolated_job.sh
      - name: Compile sources and run unit tests
        run: |
          python -m compileall -q mqv_eda tests
          python -m pytest -q -rs --junitxml=unit-test-results.xml
      - name: Build and smoke-test distributable package
        run: |
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/mqv-install-test"
          "$RUNNER_TEMP/mqv-install-test/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/mqv-install-test/bin/mqv-eda" --help
          "$RUNNER_TEMP/mqv-install-test/bin/python" -c "import mqv_eda; print('Installed MAH Quantum Verify', mqv_eda.__version__)"
      - name: Upload installable release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mah-quantum-verify-python-distribution
          path: dist/
          if-no-files-found: error
      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session1-unit-test-evidence
          path: unit-test-results.xml
          if-no-files-found: warn

  eda-toolchain-regression:
    name: Real EDA toolchain regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal network/build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates python3 python3-pip git
      - name: Install pinned OSS CAD Suite (official SHA-256 verified release)
        run: |
          curl --fail --location --retry 3 \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-10-22/oss-cad-suite-linux-x64-20261022.tgz \
            --output "$RUNNER_TEMP/oss-cad-suite-linux-x64-20261022.tgz"
          echo "45b7401d677f1e6cffb19dcaafb8e92c95a49dfc05b332ae4d00b84c94f62f6e  $RUNNER_TEMP/oss-cad-suite-linux-x64-20261022.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/oss-cad-suite-linux-x64-20261022.tgz" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/oss-cad-suite/bin/iverilog"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Build OpenSTA from upstream source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential cmake git curl tcl-dev swig bison flex             automake autotools-dev libeigen3-dev libfmt-dev zlib1g-dev libfl-dev
          mkdir -p "$RUNNER_TEMP/opensta"
          curl --fail --location --retry 3             https://raw.githubusercontent.com/davidkebo/cudd/main/cudd_versions/cudd-3.0.0.tar.gz             --output "$RUNNER_TEMP/cudd-3.0.0.tar.gz"
          tar -xzf "$RUNNER_TEMP/cudd-3.0.0.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/cudd-3.0.0"
          ./configure
          make --jobs 2
          git clone https://github.com/parallaxsw/OpenSTA.git "$RUNNER_TEMP/OpenSTA"
          git -C "$RUNNER_TEMP/OpenSTA" checkout bdc4e054cb917e1b7058444829191838b302cccd
          cmake -S "$RUNNER_TEMP/OpenSTA" -B "$RUNNER_TEMP/OpenSTA/build"             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX=/usr/local             -DCUDD_DIR="$RUNNER_TEMP/cudd-3.0.0"             -DUSE_TCL_READLINE=OFF
          cmake --build "$RUNNER_TEMP/OpenSTA/build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/OpenSTA/build"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          command -v sta
          sta -version
      - name: Install pinned KLayout 0.30.10 (official package checksum verified)
        run: |
          curl --fail --location --retry 3 \
            https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.10-1_amd64.deb \
            --output /tmp/klayout_0.30.10-1_amd64.deb
          echo "674a26b464841ac7385dec3cc47c2c60  /tmp/klayout_0.30.10-1_amd64.deb" | md5sum --check -
          sudo apt-get install -y /tmp/klayout_0.30.10-1_amd64.deb

      - name: Record tool versions
        run: |
          mkdir -p artifacts
          python3 scripts/check_environment.py > artifacts/tool-environment.json
          cat artifacts/tool-environment.json
      - name: Run real EDA smoke regressions
        run: bash scripts/run_regressions.sh
      - name: Run MAH Quantum Verify engine
        run: |
          python3 -m mqv_eda verify fixtures/projects/good --top comb \
            --testbench tb_comb.v --sim-top tb_comb --out artifacts/engine-smoke
          python3 - <<'PY'
          import json
          p = json.load(open("artifacts/engine-smoke/report.json", encoding="utf-8"))
          assert p["overall_status"] == "PASS", p["overall_status"]
          required = [x for x in p["checks"] if x["required"]]
          assert required and all(x["status"] == "PASS" for x in required), required
          PY
      - name: Upload EDA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session1-eda-regression-evidence
          path: artifacts/
          if-no-files-found: warn

  ihp-sg13g2-drc:
    name: Official IHP SG13G2 DRC golden regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official KLayout 0.30.10
        run: |
          curl --fail --location --retry 3 \
            https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.10-1_amd64.deb \
            --output /tmp/klayout_0.30.10-1_amd64.deb
          echo "674a26b464841ac7385dec3cc47c2c60  /tmp/klayout_0.30.10-1_amd64.deb" | md5sum --check -
          sudo apt-get install -y /tmp/klayout_0.30.10-1_amd64.deb
          klayout -v
      - name: Install pinned IHP regression Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==2.2.3 numpy==2.1.3 gdstk==0.9.61 klayout==0.30.10 pyyaml==6.0.2 tqdm==4.67.1 termcolor==2.5.0
      - name: Fetch pinned IHP Open PDK source
        run: |
          git init "$RUNNER_TEMP/IHP-Open-PDK"
          git -C "$RUNNER_TEMP/IHP-Open-PDK" remote add origin https://github.com/IHP-GmbH/IHP-Open-PDK.git
          git -C "$RUNNER_TEMP/IHP-Open-PDK" fetch --depth=1 origin 5e6d592e4002946a4616f798c357f0f3c06cf3b6
          git -C "$RUNNER_TEMP/IHP-Open-PDK" checkout --detach FETCH_HEAD
          test -f "$RUNNER_TEMP/IHP-Open-PDK/ihp-sg13g2/libs.tech/klayout/tech/drc/ihp-sg13g2.drc"
          test -f "$RUNNER_TEMP/IHP-Open-PDK/ihp-sg13g2/libs.tech/klayout/tech/drc/testing/testcases/unit_golden/activ_golden.gds"
      - name: Run official IHP DRC golden regression for activ table
        run: |
          set +e
          PDK="$RUNNER_TEMP/IHP-Open-PDK"
          TEST_DIR="$PDK/ihp-sg13g2/libs.tech/klayout/tech/drc/testing"
          python "$TEST_DIR/run_regression.py" \
            --table_name=activ \
            --run_dir="$RUNNER_TEMP/ihp-drc-activ" \
            --mp=2 2>&1 | tee "$RUNNER_TEMP/ihp-drc-activ.log"
          rc=${PIPESTATUS[0]}
          mkdir -p artifacts/ihp-drc-activ
          cp -R "$RUNNER_TEMP/ihp-drc-activ/." artifacts/ihp-drc-activ/ 2>/dev/null || true
          cp "$RUNNER_TEMP/ihp-drc-activ.log" artifacts/ihp-drc-activ.log 2>/dev/null || true
          # The upstream runner may return 1 for a golden layout that intentionally
          # triggers expected DRC markers. Its own differential golden-table verdict
          # is authoritative only when it explicitly reports all testcases passed.
          if grep -q "# All testcases passed." "$RUNNER_TEMP/ihp-drc-activ.log" && \
             grep -q "Test completed successfully." "$RUNNER_TEMP/ihp-drc-activ.log"; then
            echo "IHP golden comparison passed: no unexpected/golden-missing violations."
            exit 0
          fi
          echo "IHP golden comparison failed or produced no explicit success summary (runner exit=$rc)."
          exit 1
      - name: Upload IHP DRC regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ihp-sg13g2-drc-activ-evidence
          path: artifacts/ihp-drc-activ/
          if-no-files-found: warn
          retention-days: 30

  picorv32-reference-evaluation:
    name: MQV evaluation on PicoRV32 reference RTL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout MAH Quantum Verify
        uses: actions/checkout@v4

      - name: Checkout pinned PicoRV32 source
        uses: actions/checkout@v4
        with:
          repository: YosysHQ/picorv32
          ref: ef203c2b0a3fb793280f5114941416c425c5b461
          path: external/picorv32

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned OSS CAD Suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-10-22/oss-cad-suite-linux-x64-20261022.tgz \
            --output "$RUNNER_TEMP/oss-cad-suite.tgz"
          echo "45b7401d677f1e6cffb19dcaafb8e92c95a49dfc05b332ae4d00b84c94f62f6e  $RUNNER_TEMP/oss-cad-suite.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prepare source and capture provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation-input/picorv32 artifacts
          cp external/picorv32/picorv32.v evaluation-input/picorv32/
          {
            echo "Reference: YosysHQ/PicoRV32"
            echo "Pinned commit: ef203c2b0a3fb793280f5114941416c425c5b461"
            sha256sum evaluation-input/picorv32/picorv32.v
          } | tee artifacts/picorv32-provenance.txt
          python -m pip install -r requirements-dev.txt
          python -m mqv_eda doctor --json | tee artifacts/picorv32-doctor.json

      - name: Run MQV on PicoRV32 core RTL
        shell: bash
        run: |
          set +e
          python -m mqv_eda verify evaluation-input/picorv32 \
            --top picorv32 --out artifacts/picorv32-mqv --timeout 180 \
            2>&1 | tee artifacts/picorv32-console.log
          rc=${PIPESTATUS[0]}
          echo "MQV exit code: $rc"
          echo "$rc" > artifacts/picorv32-mqv-exit-code.txt
          # Keep evidence even when MQV reports a design/check failure.
          exit 0

      - name: Upload PicoRV32 evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mqv-picorv32-evaluation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
