name: Session 1 EDA regression

on:
  push:
    branches: [session1-core]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session1-eda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-eda:
    name: Linux EDA build and smoke regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OpenSTA build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git curl ca-certificates \
            python3-dev python3-pip python3-venv \
            flex bison swig tcl-dev zlib1g-dev libfl-dev \
            automake autotools-dev libeigen3-dev libfmt-dev

      - name: Install pinned OSS CAD Suite (official SHA-256 verified release)
        run: |
          curl --fail --location --retry 3 \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-10-22/oss-cad-suite-linux-x64-20261022.tgz \
            --output "$RUNNER_TEMP/oss-cad-suite-linux-x64-20261022.tgz"
          echo "45b7401d677f1e6cffb19dcaafb8e92c95a49dfc05b332ae4d00b84c94f62f6e  $RUNNER_TEMP/oss-cad-suite-linux-x64-20261022.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/oss-cad-suite-linux-x64-20261022.tgz" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/oss-cad-suite/bin/iverilog"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Install pinned KLayout build (official package, checksum verified)
        run: |
          curl --fail --location --retry 3 \
            https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.10-1_amd64.deb \
            --output /tmp/klayout_0.30.10-1_amd64.deb
          echo "674a26b464841ac7385dec3cc47c2c60  /tmp/klayout_0.30.10-1_amd64.deb" | md5sum --check -
          sudo apt-get install -y /tmp/klayout_0.30.10-1_amd64.deb

      - name: Install pinned OpenSTA CUDD dependency
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/davidkebo/cudd/main/cudd_versions/cudd-3.0.0.tar.gz \
            --output "$RUNNER_TEMP/cudd-3.0.0.tar.gz"
          tar -xzf "$RUNNER_TEMP/cudd-3.0.0.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/cudd-3.0.0"
          ./configure
          make --jobs 2

      - name: Build pinned OpenSTA from source
        run: |
          git clone https://github.com/parallaxsw/OpenSTA.git "$RUNNER_TEMP/OpenSTA"
          git -C "$RUNNER_TEMP/OpenSTA" checkout bdc4e054cb917e1b7058444829191838b302cccd
          cmake -S "$RUNNER_TEMP/OpenSTA" -B "$RUNNER_TEMP/OpenSTA/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCUDD_DIR="$RUNNER_TEMP/cudd-3.0.0" \
            -DUSE_TCL_READLINE=OFF
          cmake --build "$RUNNER_TEMP/OpenSTA/build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/OpenSTA/build"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Install MAH Quantum EDA core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify required executables are present
        run: |
          set -eu
          for tool in iverilog vvp verilator yosys ghdl z3 sby sta klayout; do
            command -v "$tool"
          done
          klayout -v
          yosys -V
          verilator --version
          iverilog -V
          ghdl --version
          z3 --version
          sby --help >/dev/null
          sta -version

      - name: Run real tool-backed regression tests
        env:
          MQV_REQUIRE_ALL_TOOLS: "1"
        run: |
          mkdir -p artifacts
          set -o pipefail
          pytest -q -rs --junitxml=artifacts/junit.xml 2>&1 | tee artifacts/pytest.log

      - name: Capture toolchain manifest and source archive
        if: always()
        run: |
          mkdir -p artifacts
          python -m mahqv_eda.cli doctor --json > artifacts/toolchain.json || true
          git rev-parse HEAD > artifacts/source-commit.txt
          git archive --format=zip --output="artifacts/mahqv-eda-session1-${GITHUB_SHA:0:12}.zip" HEAD

      - name: Upload regression evidence and source package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahqv-eda-session1-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
